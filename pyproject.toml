[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otio-dawproject-adapter"
version = "0.1.0"
description = "OpenTimelineIO adapter for DAWproject audio timelines"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["opentimelineio>=0.16"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."opentimelineio.plugins"]
otio_dawproject_adapter = "otio_dawproject_adapter"

[tool.setuptools.package-data]
otio_dawproject_adapter = ["plugin_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
